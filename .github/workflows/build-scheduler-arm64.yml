name: Build scheduler ARM64 container

on:
  workflow_dispatch:
  push:
    branches:
      - deploy/easypanel-minimal
    paths:
      - "deploy/scheduler/**"
      - ".github/workflows/build-scheduler-arm64.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: arm64-scheduler-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish ARM64 scheduler
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/scheduler/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/werlleybatista01/deskcommcrm:scheduler-arm64-latest
            ghcr.io/werlleybatista01/deskcommcrm:scheduler-arm64-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
